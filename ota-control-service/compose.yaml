services:
  mysql:
    image: mysql:8.4
    container_name: vehicle-ota-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${DB_NAME:-vehicle_ota}
      MYSQL_USER: ${DB_USERNAME:-ota_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ota_pass}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8.0.4
    container_name: vehicle-ota-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-ota_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ota_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-vehicle_ota}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  mongodb_data:
