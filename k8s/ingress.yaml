apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ota-control-service
  namespace: vehicle-ota
spec:
  ingressClassName: nginx
  rules:
    - host: ota.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ota-control-service
                port:
                  number: 8080
